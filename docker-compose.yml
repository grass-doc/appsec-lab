# AppSec Lab — services get added phase by phase.
# See PEH/AppSec Lab/Roadmap.md for the build order and PEH/AppSec Lab/Architecture.md for why.

services:
  # Phase 1 — Target App: deliberately vulnerable app, traffic generator for the whole stack.
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    # No host port mapping anymore — nginx is now the only way in from outside Docker.
    expose:
      - "3000"

  # Phase 2 — Reverse Proxy: single controlled entry point in front of the target app.
  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - juice-shop

  # Phase 3 - CrowdSec
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/nginx"
    volumes:
      - ./nginx/logs:/var/log/nginx:ro   # reads the same logs Phase 2 already set up
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-db:/var/lib/crowdsec/data/
    depends_on:
      - nginx

volumes:
  crowdsec-db:
