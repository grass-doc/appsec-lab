server {
    listen 80;
    server_name lab.local;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        proxy_pass http://juice-shop:3000;

        # Preserve the real client IP through the proxy hop —
        # without these, every downstream log (CrowdSec, Elastic) sees nginx's
        # own container IP as the source of every request instead of the real one.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
